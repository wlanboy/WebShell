spring:
  application:
    name: webshell
  main:
    banner-mode: "off"
  threads:
    virtual:
      enabled: true
server:
  port: ${PORT:8001}
  servlet:
    session:
      cookie:
        same-site: strict
        http-only: true
  jetty:
    # mit virtuellen Threads begrenzt threads.max die gleichzeitigen Requests
    threads:
      max: 50
    max-connections: 512
    connection-idle-timeout: 15s
webshell:
  workdir: /tmp
  timeout: 30s
  max-output: 1MB
