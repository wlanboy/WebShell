spring:
  application:
    name: webshell
  main:
    banner-mode: "off"
  threads:
    virtual:
      enabled: true
server:
  port: ${PORT:8001}
  jetty:
    # mit virtuellen Threads begrenzt threads.max die gleichzeitigen Requests
    threads:
      max: 50
    max-connections: 512
    connection-idle-timeout: 15s
